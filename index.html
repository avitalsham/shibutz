<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שיבוץ מדויקות</title>
<meta name="description" content="מערכת שיבוץ משותפת לחניכות ולחונכות בתוכנית מדויקות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header + tabs; matching board = three columns (mentees · decision · mentors), stacks on narrow screens */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#13201E; --muted:#5A6A67; --line:#D6DEDC;
  --accent:#0B6E63; --accent-ink:#FFFFFF; --accent-soft:#DDEFEB;
  --mentor:#9A4A1C; --mentor-soft:#F6E7DC;
  --hard:#B42318; --hard-soft:#FDE8E6; --warn:#A15C07; --warn-soft:#FDF1DC; --ok:#1E7B45; --ok-soft:#E1F3E8; --info:#475467; --info-soft:#EEF0F3;
  --f-body:"IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --f-display:"Suez One", "IBM Plex Sans Hebrew", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --open:#CBD5D3; --mentor-tint:#DCEAF8; --mentor-tint-line:#B3CEEE; --grp-tint:#F2ECFB; --grp-line:#D9C9F2; --sel:#D3E5F8; --sel-line:#3B7DD8;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#161F1E; --sunk:#111918; --ink:#E4ECEA; --muted:#93A39F; --line:#2A3533;
  --accent:#4FC3B2; --accent-ink:#06211D; --accent-soft:#163430;
  --mentor:#E59C6C; --mentor-soft:#3A2618;
  --hard:#F97066; --hard-soft:#3D1814; --warn:#F2B04A; --warn-soft:#3A2A10; --ok:#5BCB8A; --ok-soft:#14301F; --info:#A9B4C2; --info-soft:#1E2630; --open:#3B4A47; --mentor-tint:#1A2D45; --mentor-tint-line:#2D4A6E; --grp-tint:#251C38; --grp-line:#3E2F5E; --sel:#1F3A5C; --sel-line:#6FA8F0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#161F1E; --sunk:#111918; --ink:#E4ECEA; --muted:#93A39F; --line:#2A3533;
  --accent:#4FC3B2; --accent-ink:#06211D; --accent-soft:#163430;
  --mentor:#E59C6C; --mentor-soft:#3A2618;
  --hard:#F97066; --hard-soft:#3D1814; --warn:#F2B04A; --warn-soft:#3A2A10; --ok:#5BCB8A; --ok-soft:#14301F; --info:#A9B4C2; --info-soft:#1E2630; --open:#3B4A47; --mentor-tint:#1A2D45; --mentor-tint-line:#2D4A6E; --grp-tint:#251C38; --grp-line:#3E2F5E; --sel:#1F3A5C; --sel-line:#6FA8F0;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
[hidden]{display:none!important}
#app{direction:rtl;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.top-row>.burger{order:-1}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.2px}
.brand small{color:var(--muted)}
.area-pick{display:flex;align-items:center;gap:8px}
.area-pick label{color:var(--muted);font-size:13px}
select,input[type=text],input[type=search],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
textarea{width:100%;min-height:60px;resize:vertical}
.peers{display:flex;align-items:center;gap:4px}
.peers .av{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);margin-inline-start:-8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.login{max-width:420px;margin:40px auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.login input{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.peers span{color:var(--muted);font-size:12px;margin-inline-start:6px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.live i{background:var(--ok)}
nav.tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--hard);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-inline-start:6px;font-family:var(--f-mono)}
.badge.soft{background:var(--line);color:var(--ink)}

main{padding-block:16px 60px;padding-inline:16px;max-width:1560px;margin:0 auto}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:var(--r);margin-bottom:14px;background:var(--info-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.banner b{font-weight:600}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--hard);border-color:var(--hard)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;line-height:20px;background:var(--info-soft);color:var(--info);white-space:nowrap}
.chip.hard{background:var(--hard-soft);color:var(--hard)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mentee{background:var(--accent-soft);color:var(--accent)}
.chip.mentor{background:var(--mentor-soft);color:var(--mentor)}
.chip.dashed{background:transparent;border:1px dashed currentColor}
.sec-title{font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:0 0 8px}
h2{font-size:18px;margin:0 0 4px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* stage ladder */
.ladder{display:inline-flex;gap:2px;vertical-align:middle;direction:rtl}
.ladder s{display:block;width:7px;height:12px;border-radius:2px;background:var(--line);text-decoration:none}
.ladder s.on{background:var(--accent)}
.ladder.m s.on{background:var(--mentor)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,2.3fr);gap:14px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:12px}
.stage-h{position:sticky;top:0;z-index:1;background:var(--sunk);padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.cand-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line);font-weight:600}
.cand-h span{font-size:12px;color:var(--muted);font-weight:400}
.col{min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 150px);position:sticky;top:120px}
.board>.col-mentors{order:1}.board>.center{order:2}.board>.col-mentees{order:3}
.col-head{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.col-head .row input{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:3px 9px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.list{overflow-y:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:right}
.item:hover{background:var(--sunk)}
.item[aria-current=true]{background:var(--sel);box-shadow:inset -4px 0 0 var(--sel-line)}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dots{display:inline-flex;gap:3px;direction:ltr}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mentor);display:block}
.dots i.f{background:var(--mentor)}
.dots i.p{background:repeating-linear-gradient(45deg,var(--mentor) 0 2px,transparent 2px 4px)}
.dots i.x{border-color:var(--hard);background:var(--hard)}
.center{min-width:0}
.card{padding:16px}
.card-mentor{background:var(--mentor-tint);border-color:var(--mentor-tint-line)}
.grp-block{background:var(--grp-tint);border-color:var(--grp-line)}
.grp-block .gm{background:var(--surface)}
.item .gcount{font-size:13px;color:var(--muted);align-self:center}
.item .gcount.full{color:var(--accent);font-weight:600}
.item .gcount.zero{opacity:.55}
.pname{font-size:22px;font-weight:700;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;margin:12px 0}
.facts div{min-width:0}
.facts dt{font-size:11px;color:var(--muted);letter-spacing:.3px}
.facts dd{margin:0;overflow-wrap:anywhere}
.notes{background:var(--warn-soft);border-radius:6px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes mark{background:transparent;color:var(--hard);font-weight:600}
.notes.done{background:var(--sunk)}
.ann{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ann label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.toggle-chips{display:flex;gap:4px}
.toggle-chips button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:34px;padding:3px 6px}
.toggle-chips button[aria-pressed=true]{background:var(--hard-soft);border-color:var(--hard);color:var(--hard);font-weight:600}
.block{margin-top:14px;padding:14px 16px}
.sugg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cand-h+.sugg{border-top:0}
.block .sugg .why{gap:3px}
.sugg:first-of-type{border-top:0}
.score{width:44px;text-align:center;font-family:var(--f-mono);font-size:15px;font-weight:500;border-radius:6px;padding:4px 0;background:var(--accent-soft);color:var(--accent)}
.score.bad{background:var(--hard-soft);color:var(--hard)}
.sugg .who{min-width:0}
.sugg .who b{cursor:pointer}
.sugg .why{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.current{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px;border-radius:6px;background:var(--mentor-soft)}
.current.prop{background:transparent;border:1.5px dashed var(--mentor)}
.confirm{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--warn-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.watchers{font-size:12px;color:var(--warn);font-weight:500}
details>summary{cursor:pointer;color:var(--muted);padding:8px 0}

/* groups */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{padding:10px 14px;min-width:130px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.gcard{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gcard.bad{border-color:var(--hard)}
.ghead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gm{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--sunk)}
.gm.prop{background:transparent;border:1px dashed var(--line)}
.gm .l{min-width:0}
.gm .l b{cursor:pointer}

/* alerts */
.alerts{display:grid;gap:12px}
.acard{padding:12px 16px}
.acard h3{display:flex;align-items:center;gap:8px}
.acard ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.acard li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.sev{width:10px;height:10px;border-radius:2px;display:inline-block}
.sev.hard{background:var(--hard)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.ok{background:var(--ok)}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}

/* phd tab */
.step{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:10px 0 6px}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.step b{font-size:15px}
.upper{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2.2fr);gap:12px;align-items:start}
.phd-top .phd-scroll{max-height:calc(50vh - 90px);overflow-y:auto}
.phd-top .grp-grid.phd-scroll{align-content:start;padding:2px}
.phd-bottom{max-height:calc(50vh - 120px);overflow-y:auto}
.phd-col h3{position:sticky;top:-12px;background:var(--surface);padding-block:4px;margin-top:-4px;z-index:1}
.phd-col{padding:12px}
.phd-col h3{display:flex;justify-content:space-between;align-items:baseline}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--surface);cursor:pointer}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.pcard .sub{grid-column:2;font-size:12px;color:var(--muted)}
.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.grp{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.grp.sel{outline:2px solid var(--accent);outline-offset:-1px}
.grp .mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;background:var(--sunk);border-radius:6px}
.mslot{border:1.5px dashed var(--line);border-radius:8px;padding:8px 10px}
.mslot.full{border:1px solid var(--mentor-tint-line);background:var(--mentor-tint)}
.mrow{display:grid;grid-template-columns:1.4fr 1.2fr .8fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
@media (max-width:800px){.upper{grid-template-columns:1fr}.mrow{grid-template-columns:1fr auto}.mrow>span:nth-child(2),.mrow>span:nth-child(3){grid-column:1}}
/* email modal */
.overlay.center-modal{justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 16px}
.modal{width:min(820px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.mf{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:6px 10px;background:var(--sunk);border-radius:6px}
.mailprev{border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-height:55vh;overflow:auto;background:#fff;color:#111}
.mailprev table{margin:6px 0;min-width:0}
.mailprev th{position:static;color:#111}
.mailprev th,.mailprev td{font-size:13px}
/* rich text editor */
.rtbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--sunk);margin-top:4px}
.rtb{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:30px;height:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.rtb.sw i{width:14px;height:14px;border-radius:50%;background:var(--c);display:block}
.rtb input[type=color]{width:22px;height:22px;border:0;padding:0;background:none}
.rtsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.rtlink{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-bottom:0;background:var(--sunk)}
.rttags{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:0;background:var(--sunk)}
.rttags .chip{border:0;cursor:pointer}
.rteditor{min-height:420px;max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:12px 14px;background:#fff;color:#111;font-family:Arial,sans-serif;font-size:14px;line-height:1.55;outline:none}
.rteditor:focus{border-color:var(--accent)}
.rteditor a{color:#1D4ED8}
/* add participant */
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.addgrid label,.addgrid .lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.addgrid input[type=text],.addgrid select,.addgrid textarea{color:var(--ink);font-size:14px}
.addgrid .row label{flex-direction:row;color:var(--ink);font-size:14px}
/* participants table */
.ptbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.pt{max-height:calc(100vh - 230px);overflow:auto}
.pt table{min-width:1500px;font-size:13px}
.pt th{z-index:2;padding:0}
.pt .thsort{background:none;border:0;padding:8px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;text-align:right;width:100%}
.pt .thsort:hover{color:var(--ink)}
.pt tbody tr{cursor:default}
.pt tbody tr.on{background:var(--accent-soft)}
.pt td{padding:6px 10px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pt select{padding:3px 6px;font-size:13px;max-width:150px}
.rtog{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;margin-inline-end:3px}
.rtog.m[aria-pressed=true]{background:var(--mentor-soft);color:var(--mentor);border:1px solid transparent}
.rtog.e[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.ptnotes{max-width:320px;min-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
/* areas */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.acard2{padding:14px;display:flex;flex-direction:column;gap:10px}
.dchips{display:flex;flex-wrap:wrap;gap:4px}
.dchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px;font-size:12px}
.dchips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchips button.taken{opacity:.5}

<script>
/*NORM-START*/
const HEB_YEAR={1:'א',2:'ב',3:'ג',4:'ד+'};
const DEPT_SCHOOL={
  'מדעי המחשב':'exact','פיזיקה':'exact','כימיה':'exact','מתמטיקה':'exact','סטטיסטיקה וחקר ביצועים':'exact','גאופיזיקה':'exact','לימודי סביבה':'exact',
  'הנדסת חשמל':'eng','הנדסה ביו-רפואית':'eng','הנדסת תעשייה וניהול':'eng','הנדסה מכנית':'eng','הנדסת חומרים':'eng','מדעים דיגיטליים להייטק':'eng'
};
const DEPT_KW={
  'מדעי המחשב':['מדעי המחשב','מדמח','מדמ"ח','מחשב'],'פיזיקה':['פיזיק','פיסיק'],'כימיה':['כימי'],'מתמטיקה':['מתמטי'],
  'סטטיסטיקה וחקר ביצועים':['סטטיס','חקר ביצועים'],'גאופיזיקה':['גאופיז','כדור הארץ'],'לימודי סביבה':['סביבה'],
  'הנדסת חשמל':['חשמל'],'הנדסה ביו-רפואית':['ביו רפו','ביורפו','ביו-רפו'],'הנדסת תעשייה וניהול':['תעשי'],'הנדסה מכנית':['מכני'],
  'הנדסת חומרים':['חומרים'],'מדעים דיגיטליים להייטק':['דיגיט','להייטק']
};
function deptFromText(t){
  if(!t) return '';
  t=String(t);
  for(const [d,kws] of Object.entries(DEPT_KW)){ if(kws.some(k=>t.includes(k))) return d; }
  return '';
}
function normDept(raw){
  if(!raw) return '';
  const s=String(raw).trim();
  if(s.startsWith('הנדסת חשמל')) return 'הנדסת חשמל';
  if(s.includes('החוג למתמטיקה')) return 'מתמטיקה';
  if(s.includes('סטטיסטיקה')) return 'סטטיסטיקה וחקר ביצועים';
  if(s.includes('גאופיזיקה')) return 'גאופיזיקה';
  if(s.includes('לימודי סביבה')) return 'לימודי סביבה';
  if(s.startsWith('מדעים דיגיטל')) return 'מדעים דיגיטליים להייטק';
  if(s.startsWith('הנדסת תעשי')) return 'הנדסת תעשייה וניהול';
  if(s.startsWith('הנדסה ביו')) return 'הנדסה ביו-רפואית';
  return s;
}
// כל שדה: רשימת כותרות אפשריות. הראשונות מקובץ תשפ"ו, האחרות מהטופס של תשפ"ז.
const COLS={
  ts:['submission time'],last:['שם משפחה'],first:['שם פרטי'],email:['אימייל','מייל'],phone:['מספר טלפון','טלפון'],
  stage:['באיזה שלב בתואר'],work:['עבודה מחוץ לאוניברסיטה','אם את עובדת מחוץ לאוניברסיטה'],role:['אני רוצה להיות','בחרי כיצד תרצי להשתתף'],
  prev:['האם השתתפת בשנה שעברה','האם השתתפת בתכנית'],
  program:['אודיסאה או עתודה','עתודה או אודיסאה'],year:['שנת לימודים','באיזה שנה תהיי','באיזו שנה תהיי'],faculty:['פקולטה'],
  deptExact:['בי"ס (מדויקים)','לאיזה בית ספר את משתייכת?'],deptEng:['בי"ס (הנדסה)','לאיזה בית ספר את משתייכת? 2'],
  track:['מסלול מחקר'],wantMentor:['בי"ס חונכת','מאיזה בית ספר תרצי לקבל חונכת'],wantMentorSpec:['בי"ס חונכת ספציפי','פרטי בית ספר ספציפי'],
  okMale:['תרגישי בנוח עם חונך','להיחנך ע"י חונך'],
  combinedOther:['מסלול לימודים משולב - אחר','אם סימנת אחר, אנא פרטי כאן'],extraExact:['חוג נוסף (מדויקים)','בתואר דו-חוגי'],
  combined:['מסלול לימודים אחר (משולב)','באיזה מסלול לימודים את?'],
  mentorWithMale:['לחנוך עם חונך'],thesis:['מסלול (תזה או ללא תזה)','באיזה מסלול את? (תזה','במידה ואת לומדת תואר שני, באיזה מסלול'],
  wantMentees:['בי"ס חניכות','מאיזה בית ספר תרצי לקבל חניכות'],wantMenteesSpec:['בי"ס חניכות ספציפי','פרטי בית ספר ספציפי 2'],
  baWhere:['תואר ראשון היכן','היכן עשית אותו?'],baWhat:['תואר ראשון במה','במה התואר הראשון שלך'],
  maWhere:['תואר שני היכן','היכן עשית אותו? 2'],maWhat:['תואר שני במה','במה התואר השני שלך'],
  phdWhere:['תואר שלישי היכן','היכן עשית אותו? 3'],phdWhat:['תואר שלישי במה','במה התואר השלישי שלך'],
  notes:['הערות','משהו נוסף שתרצי לספר'],gift:['מתנה'],community:['מדויקות בקהילה'],semester:['באיזה סמסטר התחלת']
};
const OPTIONAL_COLS=['gift','community','semester','extraExact','combinedOther','track','work','program','wantMentorSpec','wantMenteesSpec','baWhere','baWhat','maWhere','maWhat','phdWhere','phdWhat'];
function mapHeader(header){
  const H=header.map(h=>String(h==null?'':h).trim().replace(/\s+/g,' ').toLowerCase());
  const used=new Set(), idx={};
  // exact matches first, then "starts with", then "includes"
  for(const pass of ['eq','starts','inc']){
    for(const [k,names] of Object.entries(COLS)){
      if(idx[k]!=null) continue;
      for(const n of names){
        const nn=n.toLowerCase();
        const i=H.findIndex((h,j)=>!used.has(j)&&(pass==='eq'?h===nn:pass==='starts'?h.startsWith(nn):h.includes(nn)));
        if(i>=0){idx[k]=i;used.add(i);break;}
      }
    }
  }
  return idx;
}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}
function clean(v){ if(v==null) return ''; let s=String(v).trim();
  // בטופס החדש תשובות מרובות מגיעות כ־["חניכה","חונכת"]
  if(s.startsWith('[')&&s.endsWith(']')){ try{ const a=JSON.parse(s); if(Array.isArray(a)) s=a.map(x=>String(x).trim()).filter(Boolean).join(', '); }catch(e){} }
  return s; }
function phoneStr(v){
  if(v==null||v==='') return '';
  let s=typeof v==='number'?String(Math.round(v)):String(v).replace(/[^\d+]/g,'');
  if(/^\d{9}$/.test(s)) s='0'+s;
  return s;
}
const TA_RE=/מתרגל|מדריכ[הת]\s*(?:ה)?מעבד|בודק[ת]?\s*תרגיל|עוזר[ת]?\s*הוראה|\bTA\b/;
function parseTaYears(t){
  const ys=new Set(); if(!t||!TA_RE.test(t)) return [];
  const L={'א':1,'ב':2,'ג':3,'ד':4};
  for(const m of t.matchAll(/(?:שנה|שנים|שנת|שנתון|לשנה|שנתונים)\s*([א-ד])['׳"]?(?:\s*[-–]\s*([א-ד])['׳"]?)?(?![א-ת])/g)){
    const a=L[m[1]], b=m[2]?L[m[2]]:a; for(let i=Math.min(a,b);i<=Math.max(a,b);i++) ys.add(i);
  }
  const O={'ראשונה':1,'הראשונה':1,'שנייה':2,'שניה':2,'השנייה':2,'השניה':2,'שלישית':3,'השלישית':3,'רביעית':4,'הרביעית':4};
  for(const m of t.matchAll(/(?:מתרגל\S*|סטודנט\S*|תרגול)[^.\n]{0,25}?שנה\s+(ה?(?:ראשונה|שנייה|שניה|שלישית|רביעית))/g)){ ys.add(O[m[1]]); }
  return [...ys].sort();
}
function buildPerson(g){
  const first=clean(g('first')), last=clean(g('last')), email=clean(g('email')).toLowerCase();
  if(!first&&!last&&!email) return null;
  const sRaw=clean(g('stage'));
  const stageLabel=/ראשון/.test(sRaw)?'תואר ראשון':/שני/.test(sRaw)?'תואר שני':/שלישי|דוקטורט|דוקטורנט/.test(sRaw)&&!/פוסט/.test(sRaw)?'תואר שלישי':/פוסט/.test(sRaw)?'פוסט דוקטורט':/סגל/.test(sRaw)?'חברת סגל':sRaw;
  const yRaw=clean(g('year'));
  const ym=yRaw.match(/שנה\s*([א-ד])/);
  const year=ym?{'א':1,'ב':2,'ג':3,'ד':4}[ym[1]]:null;
  let rank=null;
  if(stageLabel==='תואר ראשון') rank=year?10+year:null;
  else if(stageLabel==='תואר שני') rank=20; else if(stageLabel==='תואר שלישי') rank=30;
  else if(stageLabel==='פוסט דוקטורט') rank=40; else if(stageLabel==='חברת סגל') rank=50;
  const roleRaw=clean(g('role'));
  const fac=clean(g('faculty'));
  let school=fac==='מדעים מדויקים'?'exact':fac==='הנדסה'?'eng':fac.includes('משולב')?'both':fac==='ניהול'?'mgmt':'';
  let dept='',dept2='';
  const combined=clean(g('combined')), combinedOther=clean(g('combinedOther'));
  if(g('deptExact')) dept=normDept(g('deptExact'));
  else if(g('deptEng')) dept=normDept(g('deptEng'));
  if(combined){
    const C={'הנדסת חשמל ופיזיקה':['הנדסת חשמל','פיזיקה'],'הנדסת מחשבים - הנדסת חשמל ומדעי המחשב':['הנדסת חשמל','מדעי המחשב'],
      'כימיה והנדסת חומרים':['הנדסת חומרים','כימיה'],'הנדסה מכנית ומדעי כדור הארץ':['הנדסה מכנית','גאופיזיקה']}[combined];
    if(C){ if(!dept) dept=C[0]; dept2=C[0]===dept?C[1]:C[0]; }
    else if(combinedOther){ const d=deptFromText(combinedOther); if(!dept) dept=d||'משולב – אחר'; else if(d&&d!==dept) dept2=d; }
  }
  const extra=clean(g('extraExact'));
  if(extra&&!dept2){ const d=deptFromText(extra); if(d&&d!==dept) dept2=d; }

function evaluate(e,m,opts={}){
  const hard=[],warn=[],info=[],good=[]; let score=50;
  if(!e||!m) return {hard:['נרשמת חסרה'],warn,info,good,score:0,ok:false};
  if(e.id===m.id) hard.push('אותה נרשמת');
  if(!m.mentor) hard.push('לא נרשמה כחונכת');
  if(!e.mentee) hard.push('לא נרשמה כחניכה');
  if(!isActive(m)) hard.push('החונכת סומנה כלא פעילה');
  if(!isActive(e)) hard.push('החניכה סומנה כלא פעילה');
  if(e.rank==null||m.rank==null) warn.push('שלב אקדמי חסר בטופס');
  else if(m.rank<=e.rank) hard.push(`החונכת (${stageShort(m)}) לא בשלב מתקדם מהחניכה (${stageShort(e)})`);
  else if(m.rank<20&&m.rank-e.rank===1){score-=4;info.push('פער של שנה אחת בלבד');}
  const S1=schoolsOf(e),S2=schoolsOf(m);
  if(!S1.length||!S2.length) warn.push('בית ספר חסר בטופס');
  else if(!S1.some(s=>S2.includes(s))) hard.push(`בית ספר שונה (${SCHOOL_NAME[e.school]} / ${SCHOOL_NAME[m.school]})`);
  const sd=sameDept(e,m);
  const ta=taOf(m);
  if(e.year&&ta.years.includes(e.year)&&(sd||!m.dept)){
    if(ta.confirmed) hard.push(`החונכת מתרגלת את שנה ${HEB_YEAR[e.year]}`);
    else {warn.push(`ייתכן שמתרגלת שנה ${HEB_YEAR[e.year]} — לאמת בהערות`);score-=10;}
  }
  if(S.matches.get(m.id)?.mentor===e.id) hard.push('החניכה היא החונכת שלה (שיבוץ הפוך)');
  if(isCo(m.id)&&!opts.asCo) hard.push('חונכת שותפה בקבוצה אחרת');
  const load=opts.loadOf?opts.loadOf(m.id):groupOf(m.id).filter(x=>x!==e.id).length;
  const cap=capOf(m);
  if(!opts.ignoreCap&&load>=cap) hard.push(`הקבוצה מלאה (${load}/${cap})`);
  if(sd){score+=30;good.push('אותה מחלקה');}
  else{
    const grad=e.rank!=null&&e.rank>=20;
    let pen=grad?6:24; if(e.wantMentor==='any') pen=Math.round(pen/2);
    score-=pen;
    if(grad) info.push('מחלקה שונה (גמיש בתארים מתקדמים)');
    else if(e.wantMentor==='any') info.push('מחלקה שונה (לחניכה לא משנה)');
    else warn.push('מחלקה שונה');
  }
  if(e.wantMentor==='specific'&&e.wantMentorSpec){
    if(textMatchesDept(e.wantMentorSpec,m)){score+=18;good.push('תואם בקשת החניכה');}
    else if(!sd) warn.push('החניכה ביקשה: '+e.wantMentorSpec.slice(0,40));
  }
  if(m.wantMentees==='mine'&&!sd){score-=8;warn.push('החונכת ביקשה חניכות מבית הספר שלה');}
  if(m.wantMentees==='specific'&&m.wantMenteesSpec){ if(textMatchesDept(m.wantMenteesSpec,e)){score+=10;good.push('תואם בקשת החונכת');} }
  const t1=tokens(e.track),t2=tokens(m.track+' '+m.dept2); if([...t1].some(w=>t2.has(w))){score+=8;good.push('תחום מחקר דומה');}
  if(e.program&&e.program===m.program){score+=6;good.push('שתיהן ב'+e.program);}
  else if(e.program==='אודיסאה'&&/אודיס/.test(m.notes||'')){score+=6;good.push('החונכת ביקשה חניכות מאודיסאה');}
  if(load===0){score+=6;good.push('עדיין בלי חניכות');} else score-=3*load;
  if(notesPending(e)||notesPending(m)) info.push('יש הערות שלא נבדקו');
  return {hard,warn,info,good,score:Math.max(0,Math.min(99,score)),ok:!hard.length};
}

  for(const p of scoped) if(p.dups>1) dupItems.push({p:p.id,text:`מילאה את הטופס ${p.dups} פעמים — נשמרה התשובה האחרונה`});

  add('dups','warn','רישומים כפולים',dupItems,'כדאי לסמן את הרישום המיותר כ"לא פעילה".');
  const both=[];
  for(const p of scoped){ if(p.mentee&&p.mentor){ const mt=S.matches.get(p.id); const g=groupOf(p.id); if(mt&&g.length){ const myM=P(mt.mentor); if(g.includes(mt.mentor)) continue; both.push({p:p.id,text:`חניכה של ${fullName(myM)} וחונכת של ${g.length}`,sev:'info'});} } }
  const nolead=[...S.people.values()].filter(p=>regMentor(p)&&isActive(p)&&!leaderOf(p)&&(S.area==='__all'||S.area==='__none')).map(p=>({p:p.id,text:(p.dept||'ללא מחלקה')+' · '+groupOf(p.id).length+' חניכות'}));
  add('nolead','warn','חונכות בלי מובילה אחראית',nolead,'משייכים מובילה בלשונית משתתפות, או בכרטיס של החונכת.');
  add('both','info','נרשמות שהן גם חניכות וגם חונכות',both,'לוודא שזה מתאים לה.');
  add('notes','info','הערות שלא נבדקו אצל משובצות',[...notesInGroups].map(id=>({p:id,text:(P(id).notes||'').slice(0,90)})));
  const missing=scoped.filter(p=>(p.mentee||p.mentor)&&(p.rank==null||!p.school||!p.dept)).map(p=>({p:p.id,text:[p.rank==null?'שלב':null,!p.school?'בית ספר':null,!p.dept?'מחלקה':null].filter(Boolean).join(', ')+' חסר'}));
  add('missing','info','נתונים חסרים בטופס',missing);
  const noRole=scoped.filter(p=>!p.mentee&&!p.mentor).map(p=>({p:p.id,text:'לא סימנה חניכה או חונכת'}));
  add('norole','info','בלי תפקיד',noRole);
  if(S.areas.size){ const na=[...S.people.values()].filter(p=>!areaOfPerson(p)&&(p.mentee||p.mentor)).map(p=>({p:p.id,text:p.dept||'ללא מחלקה'})); if(S.area==='__all'||S.area==='__none') add('noarea','info','נרשמות שלא שייכות לאף תחום',na,'הוסיפי את המחלקה שלהן לתחום בלשונית תחומי אחריות.'); }
  return al;
}

  matches:{key:'mentee_id',set:r=>S.matches.set(r.mentee_id,{mentor:r.mentor_id,status:r.status,override:r.override||'',by:r.by_email,at:toMs(r.at)}),del:k=>S.matches.delete(k)},
  areas:{key:'id',set:r=>S.areas.set(r.id,{id:r.id,name:r.name,depts:r.depts||[],leaders:r.leaders||[],order:r.ord}),del:k=>S.areas.delete(k)},

  activity:{key:'id',set:r=>{ S.log=[mapLog(r),...S.log.filter(l=>l.id!==r.id)].sort((a,b)=>b.t-a.t).slice(0,150); },del:k=>{ S.log=S.log.filter(l=>l.id!==k); }}
};
const mapLog=r=>({...(r.data||{}),id:r.id,t:toMs(r.t),by:r.by_email,kind:r.kind});
async function fetchAll(table){
  if(table==='activity'){ const {data,error}=await sb.from('activity').select('*').order('t',{ascending:false}).limit(150); if(error) throw error; return data; }
  const out=[]; for(let from=0;;from+=1000){ const {data,error}=await sb.from(table).select('*').range(from,from+999); if(error) throw error; out.push(...data); if(data.length<1000) break; } return out;
}
const mapPhd=r=>({id:r.id,faculty:r.faculty,members:r.members||[],mentor:r.mentor_id||null,order:r.ord||0,by:r.by_email,at:toMs(r.at)});
async function loadPhd(){ const {data,error}=await sb.from('phd_groups').select('*'); if(error){ S.phdMissing=true; return; } S.phdMissing=false; S.phd=new Map(data.map(r=>[r.id,mapPhd(r)])); }
async function loadAll(){
  const tables=Object.keys(MAP);
  const res=await Promise.all(tables.map(fetchAll));
  S.people=new Map(); S.ann=new Map(); S.matches=new Map(); S.areas=new Map(); S.leaders=new Map(); S.meta=null; S.log=[];
  tables.forEach((t,i)=>{ if(t==='activity') S.log=res[i].map(mapLog); else res[i].forEach(MAP[t].set); });

async function start(){
  const cfg=window.SHIBUTZ_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.key||/PASTE/.test(cfg.url+cfg.key)){
    showScreen(`<div class="panel empty"><b>המערכת עדיין לא מחוברת למסד הנתונים</b>ערכי את הקובץ config.js והדביקי בו את כתובת הפרויקט והמפתח מ־Supabase.</div>`); setSync(false,'לא מחובר'); return;
  }
  sb=supabase.createClient(cfg.url,cfg.key);
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); });
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ setSync(false,'לא מחוברת'); loginScreen(); return; }
  S.uid=(session.user.email||'').toLowerCase();
  const {data:me,error}=await sb.from('leaders').select('*').eq('email',S.uid).maybeSingle();
  if(error){ showScreen(`<div class="panel empty"><b>אין חיבור למסד הנתונים</b>${esc(error.message)}</div>`); return; }
  if(!me){
    renderMe();

    setSync(false,'אין הרשאה'); return;
  }
  chan=sb.channel('shibutz',{config:{presence:{key:S.uid}}});
  for(const t of Object.keys(MAP)){
    chan.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
      if(p.eventType==='DELETE'){ const k=p.old&&p.old[MAP[t].key]; if(k!=null) MAP[t].del(k); }
      else MAP[t].set(p.new);
      if(t==='leaders'&&!S.leaders.has(S.uid)) location.reload();
      if(t==='leaders'){ const me=S.leaders.get(S.uid); if(me){S.role=me.role;S.readOnly=me.role==='viewer';} }
      rerenderSoon();
    });
  }
  sb.channel('shibutz-phd').on('postgres_changes',{event:'*',schema:'public',table:'phd_groups'},p=>{ if(p.eventType==='DELETE'){ if(p.old&&p.old.id) S.phd.delete(p.old.id); } else S.phd.set(p.new.id,mapPhd(p.new)); rerenderSoon(); }).subscribe();
  chan.on('presence',{event:'sync'},()=>{ renderPeers(); if(S.tab==='board'&&S.sel) rerenderSoon(); });
  let first=true;
  chan.subscribe(async st=>{
    if(st==='SUBSCRIBED'){ setSync(true); pushPresence(); try{ await loadAll(); }catch(e){ toast(errText(e),true); } first=false; }
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ setSync(false,'החיבור נקטע — מנסה להתחבר מחדש'); }
  });
  try{ await loadAll(); }catch(e){ toast(errText(e),true); }
  renderMe();
}

async function assign(eid,mid,{expected,status='final',override='',force=false}={}){
  if(S.readOnly) return toast('יש לך הרשאת צפייה בלבד',true);
  const e=P(eid), m=P(mid);
  if(!override&&groupOf(mid).filter(x=>x!==eid).length>=capOf(m)){ toast(`הקבוצה של ${fullName(m)} כבר מלאה (${capOf(m)} חניכות)`,true); return; }
  let r; try{ r=await W(()=>sb.rpc('assign_match',{p_mentee:eid,p_mentor:mid,p_expected:expected||null,p_status:status,p_override:override||'',p_force:!!force})); }catch(err){ return; }
  if(r&&r.conflict){
    S.pending={eid,mid,status,override,msg:`בזמן שעבדת, ${leaderName(r.by)} שיבצה את ${fullName(e)} אל ${fullName(P(r.mentor))} (${ago(toMs(r.at))}). להחליף?`};
    render(); return;
  }
  S.pending=null; S.overrideFor=null;
  toast(`${fullName(e)} שובצה אל ${fullName(m)}`);
}
async function unassign(eid){

}
async function approve(eids){

  toast(eids.length>1?`${eids.length} הצעות אושרו`:'השיבוץ אושר');
  logAct('approve',{n:eids.length,e:eids.length===1?eids[0]:null});

  await W(()=>sb.from('ann').upsert({person_id:pid,data:{...cur,...patch},by_email:S.uid,at:new Date().toISOString()}));

async function splitArea(aid){
  if(S.readOnly) return;
  const a=S.areas.get(aid); const ls=(a.leaders||[]).filter(e=>S.leaders.has(e)); if(ls.length<2) return;
  const ms=[...S.people.values()].filter(p=>p.mentor&&isActive(p)&&areaOfPerson(p)===aid);
  const cnt=new Map(ls.map(e=>[e,ms.filter(m=>isManualLeader(m)&&A(m.id).leader===e).length]));
  const todo=ms.filter(m=>!isManualLeader(m)).sort((x,y)=>byStage(x,y)||(x.dept||'').localeCompare(y.dept||'','he')||fullName(x).localeCompare(fullName(y),'he'));
  if(!todo.length){ toast('כל החונכות בתחום כבר משויכות למובילה'); return; }
  const now=new Date().toISOString(); const rows=[];
  for(const m of todo){ const e=[...cnt.entries()].sort((p,q)=>p[1]-q[1])[0][0]; cnt.set(e,cnt.get(e)+1); const {by,at,...cur}=S.ann.get(m.id)||{}; rows.push({person_id:m.id,data:{...cur,leader:e},by_email:S.uid,at:now}); }
  for(let i=0;i<rows.length;i+=100) await W(()=>sb.from('ann').upsert(rows.slice(i,i+100)));
  toast(`${rows.length} חונכות חולקו בין ${ls.length} מובילות`);
  logAct('split',{n:rows.length,area:a.name});
}
async function autoSuggest(){
  if(S.readOnly) return;
  const mentees=[...S.people.values()].filter(p=>inScope(p)&&regMentee(p)&&isActive(p)&&!S.matches.has(p.id));
  const pool=[...S.people.values()].filter(p=>regMentor(p)&&isActive(p)&&(S.mentorScope==='all'||mentorInScope(p)));
  if(!mentees.length){toast('אין חניכות פנויות בתחום');return;}
  const load=new Map(pool.map(m=>[m.id,groupOf(m.id).length]));
  const opts={loadOf:id=>load.get(id)||0};
  const cand=mentees.map(e=>({e,list:pool.map(m=>({m,ev:evaluate(e,m,opts)})).filter(x=>x.ev.ok)}));
  cand.sort((a,b)=>a.list.length-b.list.length);
  const plan=[]; let none=0;
  for(const c of cand){
    const best=c.list.map(x=>({m:x.m,ev:evaluate(c.e,x.m,opts)})).filter(x=>x.ev.ok).sort((a,b)=>b.ev.score-a.ev.score)[0];
    if(!best){none++;continue;}
    plan.push([c.e.id,best.m.id]); load.set(best.m.id,(load.get(best.m.id)||0)+1);
  }
  S.busy=`שומרת ${plan.length} הצעות…`; render();
  let n=0;
  for(const [eid,mid] of plan){ const {data,error}=await sb.rpc('assign_match',{p_mentee:eid,p_mentor:mid,p_expected:null,p_status:'proposed',p_override:'',p_force:false}); if(!error&&data&&!data.conflict) n++; if(n%10===0){S.busy=`שומרת הצעות… ${n}/${plan.length}`;render();} }
  S.busy='';
  toast(`נוספו ${n} הצעות לשיבוץ${none?` · ל־${none} חניכות לא נמצאה חונכת מתאימה`:''}`);
  logAct('auto',{n,none});
  render();
}

function personItem(p,{showMatch=true}={}){

const DEFAULT_TPL={subject:"תכנית 'מדויקות' - פרטי השיבוצים",body:"שלום {שם_החונכת}, ברכות על הצטרפותך כחונכת לתוכנית 'מדויקות'.\n\nאז, מה בעצם קורה עכשיו?\nאת מקבלת קבוצת חניכה, מגיעה למפגש הכנה לחונכות, יוצרת קשר עם החניכות ומתחילה את התוכנית!\nאת הולכת לחנוך {כמות_החניכות} סטודנטיות לתואר {תואר_החניכות}. הנה פרטי החניכות:\n\n{טבלת_החניכות}\n\nחשוב להשיב במייל חוזר למייל זה שאכן קיבלת את השיבוצים לתוכנית.\n\nמפגש הדרכה לחונכות:\nקיימים שני מועדים למפגש ההכנה, בהם נספק פרטים נוספים על התוכנית, נשתף את מערכי החניכה ונקיים הדגמה. יהיה אוכל טוב וגם מתנות של התוכנית. משך המפגש יהיה שעה.\nאנו מזמינות אותך לבחור מועד אחד נוח ולסמן בקישור את המועד אליו תגיעי:\n• יום שני (16.12.24) בשעה 12:00. בניין וולפסון הנדסה 206\n• יום שלישי (17.12.24) בשעה 12:00. בניין ציק פויינט כיתה 480\nשימו לב, נוכחותך במפגש ההכנה לחונכות לשנה הנוכחית חשוב במיוחד, גם אם הינך חונכת ותיקה.\n\nבכל שאלה והתייעצות, את מוזמנת לפנות למובילה מבית הספר שלך. רשימת המובילות והמיילים נמצא בלינק מובילות - פרטי קשר. כל הפרטים לגבי השיבוצים ישלחו בהמשך.\n\nבנוסף לשיבוצים, ריכזנו לך כאן את הנקודות המשמעותיות שצריך לזכור לקראת השנה.\n• עלייך לדווח על מפגשי החניכה (קישור) באתר מדויקות על מנת שתוענק לך מלגה. המלגה תינתן לשתי פעימות: 1000 ₪ בסיום סמסטר א' ו-1000 ₪ בסיום סמסטר ב'.\n• עלייך להעביר שני מפגשים בסמסטר א' ועוד שלושה מפגשים בסמסטר ב' ולהיות זמינה לארבע שעות קבלה במהלך השנה (במידת הצורך).\n   ◦ במידה ותחנכי סטודנטיות בשנה א׳ בתואר ראשון, עלייך להעביר מפגש קבוצתי ומפגש אישי אחד בכל סמסטר.\n   ◦ במקרים של קבוצות גדולות בשנה א' (4+ חניכות), יש לשקול מעבר למפגשים קבוצתיים בלבד.\n• את התוכנית מלווה המעבדה לקידום קריירה. נבקש למלא את השאלון, גם את וגם החניכות טרם מהמפגש הראשון על מנת להבין את השפעות התוכנית. קישור לשאלון המחקר.\n• חשוב מאוד ליידע את רכזת חונכות בר גבסו (bargabso@mail.tau.ac.il) על כל קושי שעולה במפגשים (בתיאום מפגשים, חניכות שלא מגיבות, במציאת מקום או כל קושי לוגיסטי אחר), כך שתוכל לתת מענה.\n• זכרי כי אין זה מתפקידך להיות מורה פרטית ולתת עזרה אקדמית בקורסים.\n\nמאחלות לכולנו שתהיה לנו שנה מדהימה יחד,\nצוות 'מדויקות'."};

      ch.removeAttribute(a.name);

function ptRows(){
  const F=S.pt, q=F.q.trim();

  if(q) rows=rows.filter(p=>[fullName(p),p.email,p.dept,p.dept2,p.track,p.notes,p.phone].some(x=>(x||'').includes(q)));
  if(F.role==='mentee') rows=rows.filter(p=>p.mentee); else if(F.role==='mentor') rows=rows.filter(p=>p.mentor); else if(F.role==='both') rows=rows.filter(p=>p.mentor&&p.mentee);
  if(F.school) rows=rows.filter(p=>p.school===F.school);
  if(F.dept) rows=rows.filter(p=>p.dept===F.dept||p.dept2===F.dept);
  if(F.stage) rows=rows.filter(p=>stageGroup(p)===F.stage);
  if(F.lead==='__none') rows=rows.filter(p=>!personLeader(p)); else if(F.lead) rows=rows.filter(p=>personLeader(p)===F.lead);
  if(F.match==='done') rows=rows.filter(p=>p.mentor?groupOf(p.id).length>0:S.matches.has(p.id));
  else if(F.match==='open') rows=rows.filter(p=>p.mentor?groupOf(p.id).length===0:!S.matches.has(p.id));
  if(F.status==='active') rows=rows.filter(isActive); else if(F.status==='inactive') rows=rows.filter(p=>!isActive(p));
  const col=PT_COLS.find(c=>c.k===F.sort)||PT_COLS[4];
  rows.sort((a,b)=>{ const x=col.get(a), y=col.get(b); const r=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'he'); return r*F.dir||fullName(a).localeCompare(fullName(b),'he'); });
  return rows;
}

function vRegStats(all){

  const tally=keyFn=>{ const m=new Map(); for(const p of all){ const r=roleOf(p); if(!r) continue; const k=keyFn(p)||'לא ידוע'; const x=m.get(k)||{k,mentor:0,mentee:0,both:0,n:0,ord:Infinity}; x[r]++; x.n++; x.ord=Math.min(x.ord,p.rank??999); m.set(k,x); } return [...m.values()]; };
  const card=(title,ic,list,wide)=>{ const max=Math.max(1,...list.map(x=>x.n)); return `<div class="panel rcard${wide?' wide':''}"><h4>${ic} ${title}</h4><div class="rlist${wide?' cols':''}">${list.map(x=>`<div class="rrow"><span class="rk" title="${esc(x.k)}">${esc(x.k)}</span><div class="rbar" style="--w:${x.n*100/max}%"><i class="r-mentor" style="flex:${x.mentor}" title="חונכות: ${x.mentor}"></i><i class="r-both" style="flex:${x.both}" title="נרשמו לשני התפקידים: ${x.both}"></i><i class="r-mentee" style="flex:${x.mentee}" title="חניכות: ${x.mentee}"></i></div><b class="num">${x.n}</b></div>`).join('')}</div></div>`; };
  const tot=tally(()=> 'סה״כ')[0]||{mentor:0,mentee:0,both:0,n:0};
  const schools=tally(p=>SCHOOL_NAME[p.school]).sort((a,b)=>b.n-a.n);
  const stages=tally(p=>{ const g=stageGroup(p); return g.startsWith('תואר ראשון')?g.replace('תואר ראשון · ','ראשון · '):g; }).sort((a,b)=>a.ord-b.ord);
  const depts=tally(p=>p.dept).sort((a,b)=>b.n-a.n);
  const fresh=all.filter(p=>p.prev&&String(p.prev).startsWith('לא')).length;
  return `<div class="sec-head"><div><h3>📊 מי נרשמה השנה</h3><p class="muted">כל הנרשמות בטופס, כולל מי שאינה פעילה.</p></div></div>
    <div class="regtop">
      <div class="kpi"><span class="ic">🙋‍♀️</span><b class="num">${tot.n}</b><span>נרשמו</span></div>
      <div class="kpi"><span class="ic" style="color:#4F8FE0">●</span><b class="num">${tot.mentor+tot.both}</b><span>רוצות לחנוך</span></div>
      <div class="kpi"><span class="ic" style="color:#9B7BD8">●</span><b class="num">${tot.mentee+tot.both}</b><span>רוצות חונכת</span></div>
      <div class="kpi"><span class="ic">🤝</span><b class="num">${tot.both}</b><span>נרשמו לשני התפקידים</span></div>
      ${fresh?`<div class="kpi"><span class="ic">✨</span><b class="num">${fresh}</b><span>מצטרפות חדשות לתוכנית</span></div>`:''}
    </div>
    <div class="legend" style="margin:0 0 8px"><span><i class="r-mentor"></i>חונכות</span><span><i class="r-both"></i>שני התפקידים</span><span><i class="r-mentee"></i>חניכות</span></div>

}

function logText(l){
  const n=id=>esc(fullName(P(id)));
  switch(l.kind){
    case 'assign': return `שיבצה את ${n(l.e)} אל ${n(l.m)}${l.override?' (חריג: '+esc(l.override)+')':''}`;
    case 'reassign': return `העבירה את ${n(l.e)} מ־${n(l.prev)} אל ${n(l.m)}`;
    case 'unassign': return `ביטלה את השיבוץ של ${n(l.e)}`;
    case 'approve': return l.e?`אישרה את השיבוץ של ${n(l.e)}`:`אישרה ${l.n} הצעות`;
    case 'auto': return `יצרה ${l.n} הצעות שיבוץ אוטומטיות`;
    case 'import': return `ייבאה ${l.n} נרשמות${l.replace?' (החלפה מלאה)':''}`;
    case 'clear': return 'מחקה את כל הנתונים';
    case 'split': return `חילקה ${l.n} חונכות בתחום ${esc(l.area||'')}`;
    case 'bulklead': return `שייכה ${l.n} משתתפות ל${esc(l.to?leaderFull(l.to):'"ללא מובילה"')}`;
    case 'role': return `${l.v?'הוסיפה':'הסירה'} את התפקיד ${l.k==='roleMentor'?'"חונכת"':'"חניכה"'} ${l.v?'ל':'מ'}${n(l.m)}`;
    case 'phd': return l.what==='create'?`יצרה קבוצת דוקטורנטיות (${l.n})`:l.what==='mentor'?`שיבצה את ${n(l.m)} כחונכת לקבוצת דוקטורנטיות`:'פירקה קבוצת דוקטורנטיות';
    case 'rejectAll': return `ביטלה ${l.n} הצעות שיבוץ אוטומטיות`;
    case 'co': return `הוסיפה את ${n(l.c)} כחונכת שותפה בקבוצה של ${n(l.m)}`;
    case 'codel': return `הסירה את ${n(l.c)} מהקבוצה של ${n(l.m)}`;
    case 'addp': return `הוסיפה ידנית את ${n(l.p)}`;
    case 'email': return `סימנה שנשלח מייל ל${n(l.m)}`;
    case 'lead': return `העבירה את ${n(l.m)} לאחריות ${esc(leaderFull(l.to)||'החלוקה לפי מחלקה')}`;
    default: return esc(l.kind||'');
  }
}

async function readFile(f){
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    const header=rows.shift()||[];
    const res=normalizeRows(header,rows);
    if(!res.people.length){toast('לא נמצאו נרשמות בקובץ. ודאי שהשורה הראשונה היא שורת הכותרות.',true);return;}
    S.importPreview={...res,fileName:f.name,replace:!!(S.meta&&S.meta.demo)};
    render();
  }catch(e){ console.error(e); toast('לא הצלחתי לקרוא את הקובץ. ודאי שזה קובץ xlsx מטופס הרישום.',true); }
}

async function doImport(){

    const total=replace?list.length:new Set([...S.people.keys(),...list.map(p=>p.id)]).size;

function exportRows(){

  const list=[...S.matches.entries()].map(([eid,mt])=>({e:P(eid),m:P(mt.mentor),mt})).filter(x=>x.e&&x.m&&(inScope(x.e)||inScope(x.m))&&(!S.exportFinal||x.mt.status==='final'));
  list.sort((a,b)=>(leaderFull(leaderOf(a.m))||'').localeCompare(leaderFull(leaderOf(b.m))||'','he')||(a.m.dept||'').localeCompare(b.m.dept||'','he')||fullName(a.m).localeCompare(fullName(b.m),'he'));
  for(const {e,m,mt} of list) rows.push([leaderFull(leaderOf(m))||'',coOf(m.id)?fullName(P(coOf(m.id))):'',fullName(m),stageShort(m),m.dept,m.email,m.phone,fullName(e),stageShort(e),e.dept,e.email,e.phone,mt.status==='proposed'?'הצעה':'מאושר',leaderFull(mt.by)]);
  for(const g of S.phd.values()){ const m=P(g.mentor); for(const id of g.members){ const e=P(id); if(!e) continue; rows.push(['דוקטורנטיות · '+PHD_FAC[g.faculty]+' · '+phdLabel(g),'',m?fullName(m):'',m?stageShort(m):'',m?m.dept:'',m?m.email:'',m?m.phone:'',fullName(e),stageShort(e),e.dept,e.email,e.phone,m?'מאושר':'בלי חונכת',leaderFull(g.by)]); } }
  return rows;
}

async function exportCsv(){

  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='shibutzim-meduyakot.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
async function copyTsv(){

    case 'logout': await sb.auth.signOut(); location.reload(); break;
    case 'changePw': { const v=$('#newPw')?.value||''; if(v.length<8){toast('סיסמה צריכה להיות באורך 8 תווים לפחות',true);break;} const {error}=await sb.auth.updateUser({password:v}); if(error) toast('הסיסמה לא נשמרה: '+error.message,true); else { toast('הסיסמה עודכנה'); $('#newPw').value=''; } break; }
    case 'addLeader': { const email=($('#newEmail')?.value||'').trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('כתובת המייל לא תקינה',true);break;} if(S.leaders.has(email)){toast('הכתובת כבר ברשימה',true);break;} await W(()=>sb.from('leaders').insert({email,name:($('#newName')?.value||'').trim(),role:$('#newRole')?.value||'leader'})).then(()=>toast('נוספה לרשימת המובילות')).catch(()=>{}); break; }
    case 'settings': S.settingsOpen=true; render(); break;
    case 'closeSettings': S.settingsOpen=false; S.clearStep=0; render(); break;
    case 'closeSettingsBg': if(ev.target===t){ S.settingsOpen=false; S.clearStep=0; render(); } break;
    case 'ptClear': S.pt={...S.pt,q:'',role:'all',school:'',dept:'',stage:'',lead:'',match:'',status:''}; render(); break;
    case 'ptSelNone': S.ptSel.clear(); render(); break;
    case 'bulkLead': { const v=$('#bulkLead')?.value; if(!v){ toast('בחרי מובילה מהרשימה',true); break; } const ids=[...S.ptSel]; const lead=v==='__clear'?'':v; const now=new Date().toISOString(); const rows=ids.map(id=>{ const {by,at,...cur}=S.ann.get(id)||{}; return {person_id:id,data:{...cur,leader:lead},by_email:S.uid,at:now}; }); try{ for(let i=0;i<rows.length;i+=100) await W(()=>sb.from('ann').upsert(rows.slice(i,i+100))); toast(`${ids.length} משתתפות שויכו ל${lead?leaderFull(lead):'"ללא מובילה"'}`); logAct('bulklead',{n:ids.length,to:lead||null}); S.ptSel.clear(); render(); }catch(e){} break; }
    case 'phdCreate': { const ids=[...S.phdSel]; if(!ids.length||ids.length>3) break; if(ids.some(id=>phdGroupOf(id))){ toast('אחת המסומנות כבר בקבוצה',true); break; } const ord=Math.max(0,...[...S.phd.values()].map(g=>g.order||0))+1; await phdWrite(()=>sb.from('phd_groups').insert({faculty:S.phdFac,members:ids,ord,by_email:S.uid}),'הקבוצה נוצרה'); S.phdSel.clear(); logAct('phd',{what:'create',n:ids.length}); render(); break; }
    case 'phdAdd': { const g=S.phd.get(S.phdGroup); const ids=[...S.phdSel]; if(!g||g.members.length+ids.length>3) break; await phdWrite(()=>sb.from('phd_groups').update({members:[...g.members,...ids],by_email:S.uid,at:new Date().toISOString()}).eq('id',g.id),`נוספו ל${phdLabel(g)}`); S.phdSel.clear(); render(); break; }
    case 'emailClose': S.emailFor=null; render(); break;
    case 'emailCloseBg': if(ev.target===t){ S.emailFor=null; render(); } break;
    case 'copyTo': { const em=buildEmail(S.emailFor); try{ await navigator.clipboard.writeText(em.to); toast('כתובת המייל הועתקה'); }catch(e){ toast('ההעתקה נחסמה. סמני את הטקסט והעתיקי ידנית.',true); } break; }
    case 'copySubj': { const em=buildEmail(S.emailFor); try{ await navigator.clipboard.writeText(em.subject); toast('הנושא הועתק'); }catch(e){ toast('ההעתקה נחסמה. סמני את הטקסט והעתיקי ידנית.',true); } break; }
    case 'copyBody': { const em=buildEmail(S.emailFor); toast(await copyRich(em.html,em.plain)?'גוף המייל הועתק, כולל הטבלה. אפשר להדביק במייל.':'ההעתקה נחסמה. סמני את הטקסט בתצוגה והעתיקי ידנית.',!0&&false); break; }
    case 'emailSent': await setAnn(S.emailFor,{emailSent:Date.now()}).catch(()=>{}); logAct('email',{m:S.emailFor}); break;
    case 'emailUnsent': await setAnn(S.emailFor,{emailSent:null}).catch(()=>{}); break;
    case 'tplSave': { const subject=($('#tplSubj')?.value||'').trim(), html=sanitizeHtml($('#tplEditor')?.innerHTML||''); await W(()=>sb.from('meta').upsert({key:'emailTemplate',data:{subject,html}})).then(()=>{ S.tplDraft=null; S.tplSubjDraft=null; toast('התבנית נשמרה'); render(); }).catch(()=>{}); break; }
    case 'tplReset': if(S.clearStep!=='tpl'){ S.clearStep='tpl'; toast('לחצי שוב כדי לחזור לנוסח המקורי. השינויים שלך יימחקו.'); break; } S.clearStep=0; await W(()=>sb.from('meta').upsert({key:'emailTemplate',data:{}})).then(()=>{ S.tplDraft=null; S.tplSubjDraft=null; toast('הוחזר הנוסח המקורי'); }).catch(()=>{}); render(); break;
    case 'coPick': S.coPick=S.sel; S.coQ=''; render(); setTimeout(()=>$('#coQ')?.focus(),0); break;
    case 'coPickClose': S.coPick=null; render(); break;
    case 'addPerson': S.addOpen=!S.addOpen; render(); break;
    case 'savePerson': await savePerson(); break;
    case 'auto': autoSuggest(); break;
    case 'approveAll': { const ids=[...S.matches.entries()].filter(([eid,mt])=>mt.status==='proposed'&&inScope(P(eid)||{})).map(([eid])=>eid); if(ids.length) await approve(ids).catch(()=>{}); break; }
    case 'confirmPending': { const p=S.pending; S.pending=null; await assign(p.eid,p.mid,{status:p.status,override:p.override,force:true}).catch(()=>{}); break; }
    case 'cancelPending': S.pending=null; render(); break;
    case 'cancelOverride': S.overrideFor=null; render(); break;
    case 'doOverride': { const why=($('#ovr')?.value||'').trim(); if(!why){toast('כתבי סיבה קצרה לעקיפת האילוץ',true);$('#ovr')?.focus();break;} const [e,m]=d.pair.split('|'); await assign(e,m,{expected:S.matches.get(e)?.mentor||null,override:why}).catch(()=>{}); break; }
    case 'taNone': await setAnn(S.sel,{ta:[],taSet:true}).catch(()=>{}); break;
    case 'addArea': await addArea('תחום חדש').catch(()=>{}); break;
    case 'areasFromDepts': { S.busy='יוצרת תחומים…'; render(); for(const dep of knownDepts()) await addArea(dep,[dep]).catch(()=>{}); S.busy=''; render(); break; }
    case 'doImport': doImport(); break;
    case 'cancelImport': S.importPreview=null; render(); break;
    case 'exportCsv': exportCsv(); break;
    case 'exportXlsx': exportXlsx(); break;
    case 'copyTsv': copyTsv(); break;
    case 'askRejectAll': S.clearStep='props'; render(); break;
    case 'rejectAll': { S.clearStep=0; const ids=[...S.matches.entries()].filter(([eid,mt])=>mt.status==='proposed'&&inScope(P(eid)||{})).map(([eid])=>eid); try{ for(let i=0;i<ids.length;i+=100) await W(()=>sb.from('matches').delete().in('mentee_id',ids.slice(i,i+100)).eq('status','proposed')); toast(`${ids.length} הצעות בוטלו`); logAct('rejectAll',{n:ids.length}); }catch(e){} render(); break; }
    case 'askClear': S.clearStep='data'; render(); break;
    case 'cancelClear': S.clearStep=0; render(); break;
    case 'doClear': doClear(); break;
  }
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='loginForm') return;
  ev.preventDefault();
  const email=($('#lemail').value||'').trim(), password=$('#lpass').value||'';
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) loginScreen(/Invalid login/i.test(error.message)?'המייל או הסיסמה שגויים.':error.message); else location.reload();
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&(S.settingsOpen||S.emailFor)){ S.settingsOpen=false; S.emailFor=null; render(); } });
document.addEventListener('toggle',ev=>{ if(ev.target.classList&&ev.target.classList.contains('facts-wrap')&&roleFor(P(S.sel),S.selRole)==='mentor') S.factsOpen=ev.target.open; },true);
let qTimer;
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='listQ'||t.id==='mentorQ'||t.id==='peopleQ'){ S[t.id]=t.value; clearTimeout(qTimer); qTimer=setTimeout(render,150); }
  if(t.id==='coQ'){ S.coQ=t.value; clearTimeout(qTimer); qTimer=setTimeout(render,150); }
  if(t.id==='ptq'){ S.pt.q=t.value; clearTimeout(qTimer); qTimer=setTimeout(render,200); }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.phdsel){ if(t.checked) S.phdSel.add(t.dataset.phdsel); else S.phdSel.delete(t.dataset.phdsel); render(); return; }
  if(t.dataset.ptf){ S.pt[t.dataset.ptf]=t.value; render(); return; }
  if(t.dataset.ptsel){ if(t.checked) S.ptSel.add(t.dataset.ptsel); else S.ptSel.delete(t.dataset.ptsel); render(); return; }
  if(t.id==='ptAll'){ const rows=ptRows(); if(t.checked) rows.forEach(p=>S.ptSel.add(p.id)); else rows.forEach(p=>S.ptSel.delete(p.id)); render(); return; }
  if(t.dataset.setlead){ await setAnn(t.dataset.setlead,{leader:t.value}).catch(()=>{}); logAct('lead',{m:t.dataset.setlead,to:t.value||null}); return; }
  if(t.dataset.lrole){ await W(()=>sb.from('leaders').update({role:t.value}).eq('email',t.dataset.lrole)).catch(()=>{}); return; }
  if(t.dataset.lname){ await W(()=>sb.from('leaders').update({name:t.value.trim()}).eq('email',t.dataset.lname)).catch(()=>{}); return; }
  if(t.id==='grpLead'){ S.area=t.value; try{localStorage.setItem('shibutz.lead',S.area);}catch(e){} pushPresence(); render(); return; }
  if(t.id==='areaSel'){ S.area=t.value; try{localStorage.setItem('shibutz.lead',S.area);}catch(e){} pushPresence(); render(); return; }
  if(t.id==='file'&&t.files[0]){ readFile(t.files[0]); t.value=''; return; }
  if(t.id==='showIdle'){ S.showAllMentorsInGroups=t.checked; render(); return; }
  if(t.id==='exportFinal'){ S.exportFinal=t.checked; return; }
  if(t.id==='replaceAll'&&S.importPreview){ S.importPreview.replace=t.checked; return; }
  if(t.dataset.ann&&S.sel){
    const k=t.dataset.ann; let v=t.type==='checkbox'?t.checked:t.value; if(k==='capacity') v=+v;
    await setAnn(S.sel,{[k]:v}).catch(()=>{}); if(k==='leader') logAct('lead',{m:S.sel,to:v||null}); return;
  }
  if(t.dataset.areaName){ const v=t.value.trim(); if(v) await W(()=>sb.from('areas').update({name:v}).eq('id',t.dataset.areaName)).catch(()=>{}); }
});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d){ev.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d) d.classList.remove('over');});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('#drop'); if(d){ev.preventDefault();d.classList.remove('over');const f=ev.dataTransfer.files[0]; if(f) readFile(f);}});

render();
start();
setInterval(()=>{ if(S.tab==='data'||S.sel) render(); },60000);
</script>
</body>
</html>
